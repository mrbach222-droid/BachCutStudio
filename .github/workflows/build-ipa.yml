name: Build BáchCut Studio IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: bachcut-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select available iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          open -a Simulator --args -CurrentDeviceUDID "$SIMULATOR_ID"
      - name: Test editing, media export and portrait-landscape UI
        run: |
          set -o pipefail
          xcodebuild -project BachCutStudio.xcodeproj -scheme BachCutStudio -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee tests.log
      - name: Export test summary and UI screenshots
        if: always()
        run: |
          if test -d TestResults.xcresult; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult > test-summary.json || true
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          fi
      - name: Compile native release app
        run: |
          set -o pipefail
          xcodebuild -project BachCutStudio.xcodeproj -scheme BachCutStudio -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Package and validate unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BachCutStudio.app Payload/
          plutil -lint Payload/BachCutStudio.app/Info.plist
          test -s Payload/BachCutStudio.app/BachCutStudio
          test -s Payload/BachCutStudio.app/Assets.car
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/BachCutStudio.app/Info.plist
          zip -qry BachCutStudio_v0.17.0_unsigned.ipa Payload
          unzip -t BachCutStudio_v0.17.0_unsigned.ipa
          shasum -a 256 BachCutStudio_v0.17.0_unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BachCutStudio-validation
          path: |
            TestResults.xcresult
            test-summary.json
            screenshots
            tests.log
            build.log
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: BachCutStudio-v0.17.0-unsigned-IPA
          path: |
            BachCutStudio_v0.17.0_unsigned.ipa
            SHA256SUMS.txt
          retention-days: 30
      - name: Publish tested IPA
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.17.0
          name: BáchCut Studio v0.17.0
          prerelease: true
          files: |
            BachCutStudio_v0.17.0_unsigned.ipa
            SHA256SUMS.txt
          body: |
            Music has adjustable gain, fade-in and fade-out, used in both preview and actual video export. Overlapping fades shorten proportionally to fit trimmed playback. Envelope changes save and undo in one action. Photos and Files import can insert an ordered video selection at the captured playhead, splitting an existing clip as needed in one Undo/Redo action. Near-boundary insertion snaps to avoid tiny fragments. Failed selections leave the project untouched. Music and overlays retain their absolute offsets. Holding a main clip switches to equal-width compact thumbnails with a visible insertion gap. Neighbours move aside; holding near either edge scrolls continuously. Releasing commits one reorder action and restores the time-based timeline without moving the playhead. Timeline filmstrip shows successive source frames. Center timecode, magnetic cut snapping and native pinch-to-zoom with center-anchored playhead improve accurate scrubbing; reorder keeps playhead stationary. Centered playhead, long-press clip reorder, MP4/MOV H.264 or HEVC plus GIF export, editable music/overlay placement and lengths, direct drag of music and overlay tracks, bounded composited preview caching for fast Undo/Redo, source in-point and length selection for music and overlays, native direct edge trimming of main video/music/overlays with one-step Undo/Redo, multi-project autosave, undo/redo, trim/split, PiP, music and Landscape Pro.
            Release is produced only after simulator unit/integration/UI tests pass. Unsigned IPA: sign before installation. Physical-device verification is still required before a production release.
          overwrite_files: true
