name: BachCutStudio
options:
  bundleIdPrefix: vn.bachcut
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.12.0'
    CURRENT_PROJECT_VERSION: '12'
targets:
  BachCutStudio:
    type: application
    platform: iOS
    sources:
      - path: BachCutStudio
      - path: Testing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.bachcut.studio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'Chọn video để dựng trong BáchCut Studio'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'Lưu video đã xuất vào thư viện Ảnh'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BachCutStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BachCutStudioTests]
    dependencies:
      - target: BachCutStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BachCutStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BachCutStudioUITests]
    dependencies:
      - target: BachCutStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BachCutStudio:
    build:
      targets:
        BachCutStudio: all
        BachCutStudioTests: [test]
        BachCutStudioUITests: [test]
    test:
      targets:
        - BachCutStudioTests
        - BachCutStudioUITests
      gatherCoverageData: true
